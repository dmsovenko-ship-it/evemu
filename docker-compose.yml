services:
  server:
    image: "evemu_server"
    build: . #Build image from source repository
    container_name: server
    volumes:
      - ./config:/app/etc
      - server_cache:/app/server_cache
      - image_cache:/app/image_cache
      - ccache:/ccache
    ports:
      - "26000:26000"
      - "26001:26001"
      - "26002:26002"
    depends_on:
      - db
    links:
      - "db"
    environment:
      - SEED_MARKET=${SEED_MARKET:-TRUE} # Set to TRUE to seed the market when the server starts for the first time
      - SEED_SATURATION=${SEED_SATURATION:-75} # Set saturation level of seed
      - SEED_REGIONS=${SEED_REGIONS:-The Forge,The Citadel,Lonetrek,Black Rise,Domain,Devoid,The Bleak Lands,Aridia,Genesis,Kador,Khanid,Kor-Azor,Tash-Murkon,Derelik,Essence,Everyshore,Placid,Verge Vendor,Sinq Laison,Solitude,Heimatar,Metropolis,Molden Heath,Curse,Stain,Venal,Great Wildlands,Syndicate,Outer Ring} # All regions with NPC stations (empire + NPC null-sec)
      - RUN_WITH_GDB=${RUN_GDB:-FALSE} #Set to TRUE to run evemu with gdb automatically
    stdin_open: true # Enables stdin for the container. Attach to it with 'docker attach'
    tty: true
    # cap_add: #This is required for gdb to work
    #   - SYS_PTRACE

  db:
    image: "mariadb:11.8"
    container_name: db
    volumes:
      - evemu_db:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_USER=evemu
      - MARIADB_PASSWORD=evemu
      - MARIADB_DATABASE=evemu
    command:
      - --innodb-buffer-pool-size=1G        # Default is 128MB — far too small for bulk seeding
      - --innodb-log-file-size=256M         # Larger redo log handles big transactions without stalling
      - --innodb-flush-log-at-trx-commit=2  # Flush every second instead of every commit (safe for dev)
      - --max-allowed-packet=64M            # Prevent packet size errors on large queries
      - --bulk-insert-buffer-size=64M       # Per-thread buffer for INSERT...SELECT
      - --log-bin=mysql-bin                 # Binary log for crash recovery (data protection)
      - --binlog-format=ROW                 # Row-based replication format

volumes:
  evemu_db:
    external: true
  server_cache:
  image_cache:
  ccache:

